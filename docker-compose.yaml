services:
  go-dev:
    container_name: go-dev
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/home/go
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: postgres://barterswap:barterswap@postgres:5432/barterswap?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    tty: true
    stdin_open: true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: barterswap
      POSTGRES_USER: barterswap
      POSTGRES_PASSWORD: barterswap
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barterswap -d barterswap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
