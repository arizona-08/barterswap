openapi: 3.0.3
info:
  title: BarterSwap API
  description: |
    API de la plateforme de troc de services entre étudiants.

    Les opérations protégées utilisent l'en-tête `X-User-ID` pour identifier
    l'utilisateur courant.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Serveur de développement

tags:
  - name: Utilisateurs
  - name: Compétences
  - name: Services
  - name: Échanges
  - name: Avis
  - name: Statistiques
  - name: CORS

paths:
  /api/users:
    post:
      tags: [Utilisateurs]
      summary: Créer un utilisateur
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              pseudo: Postman Provider
              bio: Je propose des services.
              ville: Paris
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags: [CORS]
      summary: Effectuer une requête CORS preflight
      operationId: optionsUsers
      responses:
        '204':
          description: Preflight accepté
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            Access-Control-Allow-Methods:
              schema:
                type: string
              example: GET, POST, PUT, DELETE, OPTIONS
            Access-Control-Allow-Headers:
              schema:
                type: string
              example: Content-Type, X-User-ID

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Utilisateurs]
      summary: Consulter le profil d'un utilisateur
      operationId: getUser
      responses:
        '200':
          description: Profil de l'utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Utilisateurs]
      summary: Modifier son profil
      operationId: updateUser
      security:
        - UserIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              pseudo: Postman Requester Updated
              bio: Profil modifié depuis Postman.
              ville: Lille
      responses:
        '200':
          description: Profil modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}/skills:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Compétences]
      summary: Consulter les compétences d'un utilisateur
      operationId: getUserSkills
      responses:
        '200':
          description: Liste des compétences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Compétences]
      summary: Remplacer ses compétences
      operationId: replaceUserSkills
      security:
        - UserIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillsReplace'
            example:
              skills:
                - nom: Cuisine
                  niveau: expert
                - nom: Jardinage
                  niveau: intermédiaire
      responses:
        '200':
          description: Liste des compétences remplacée
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Avis]
      summary: Lister les avis reçus par un utilisateur
      operationId: listUserReviews
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Liste des avis reçus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Statistiques]
      summary: Consulter les statistiques d'un utilisateur
      operationId: getUserStats
      responses:
        '200':
          description: Statistiques de l'utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/services:
    get:
      tags: [Services]
      summary: Lister les services
      operationId: listServices
      parameters:
        - name: categorie
          in: query
          description: Catégorie exacte du service
          schema:
            $ref: '#/components/schemas/ServiceCategory'
        - name: ville
          in: query
          description: Ville exacte du service
          schema:
            type: string
            maxLength: 100
          example: Paris
        - name: search
          in: query
          description: Texte recherché dans les services
          schema:
            type: string
            maxLength: 100
          example: cuisine
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Liste des services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Services]
      summary: Créer un service
      operationId: createService
      security:
        - UserIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
            example:
              titre: Cours de cuisine
              description: Apprendre une recette simple.
              categorie: Cuisine
              duree_minutes: 60
              credits: 2
              ville: Paris
      responses:
        '201':
          description: Service créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/services/{id}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Services]
      summary: Consulter un service
      operationId: getService
      responses:
        '200':
          description: Détails du service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Services]
      summary: Modifier un service
      operationId: updateService
      security:
        - UserIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
            example:
              titre: Cours de cuisine avancé
              description: Une recette plus complète.
              categorie: Cuisine
              duree_minutes: 90
              credits: 2
              ville: Paris
              actif: true
      responses:
        '200':
          description: Service modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Services]
      summary: Supprimer un service
      operationId: deleteService
      security:
        - UserIdHeader: []
      responses:
        '204':
          description: Service supprimé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/services/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Avis]
      summary: Lister les avis liés à un service
      operationId: listServiceReviews
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Liste des avis liés au service
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/exchanges:
    post:
      tags: [Échanges]
      summary: Créer une demande d'échange
      operationId: createExchange
      security:
        - UserIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeCreate'
            example:
              service_id: 1
      responses:
        '201':
          description: Demande d'échange créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Échanges]
      summary: Lister les échanges de l'utilisateur courant
      operationId: listExchanges
      security:
        - UserIdHeader: []
      parameters:
        - name: status
          in: query
          description: Filtrer par statut
          schema:
            $ref: '#/components/schemas/ExchangeStatus'
          example: pending
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Liste des échanges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exchange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/exchanges/{id}:
    parameters:
      - $ref: '#/components/parameters/ExchangeId'
    get:
      tags: [Échanges]
      summary: Consulter un échange
      operationId: getExchange
      security:
        - UserIdHeader: []
      responses:
        '200':
          description: Détails de l'échange
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/exchanges/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/ExchangeId'
    put:
      tags: [Échanges]
      summary: Accepter une demande et bloquer les crédits
      operationId: acceptExchange
      security:
        - UserIdHeader: []
      responses:
        '200':
          description: Échange accepté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/exchanges/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ExchangeId'
    put:
      tags: [Échanges]
      summary: Refuser une demande d'échange
      operationId: rejectExchange
      security:
        - UserIdHeader: []
      responses:
        '200':
          description: Échange refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/exchanges/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/ExchangeId'
    put:
      tags: [Échanges]
      summary: Terminer un échange et transférer les crédits
      operationId: completeExchange
      security:
        - UserIdHeader: []
      responses:
        '200':
          description: Échange terminé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/exchanges/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExchangeId'
    put:
      tags: [Échanges]
      summary: Annuler un échange et rembourser les crédits
      operationId: cancelExchange
      security:
        - UserIdHeader: []
      responses:
        '200':
          description: Échange annulé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/exchanges/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ExchangeId'
    post:
      tags: [Avis]
      summary: Publier un avis après un échange terminé
      operationId: createExchangeReview
      security:
        - UserIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
            example:
              note: 5
              commentaire: Très bon service.
      responses:
        '201':
          description: Avis créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    UserIdHeader:
      type: apiKey
      in: header
      name: X-User-ID
      description: Identifiant entier positif de l'utilisateur courant.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: Identifiant de l'utilisateur
      schema:
        type: integer
        minimum: 1
    ServiceId:
      name: id
      in: path
      required: true
      description: Identifiant du service
      schema:
        type: integer
        minimum: 1
    ExchangeId:
      name: id
      in: path
      required: true
      description: Identifiant de l'échange
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      description: Nombre maximal de résultats
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Nombre de résultats à ignorer
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: En-tête X-User-ID manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: missing or invalid X-User-ID header
    Forbidden:
      description: Action interdite pour cet utilisateur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflit avec l'état courant de la ressource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Erreur interne du serveur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal server error

  schemas:
    User:
      type: object
      required: [id, pseudo, credit_balance, created_at]
      properties:
        id:
          type: integer
          minimum: 1
        pseudo:
          type: string
          maxLength: 50
        bio:
          type: string
          maxLength: 500
        ville:
          type: string
          maxLength: 100
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        credit_balance:
          type: integer
          description: Solde de crédits de l'utilisateur
        created_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      additionalProperties: false
      required: [pseudo]
      properties:
        pseudo:
          type: string
          minLength: 1
          maxLength: 50
        bio:
          type: string
          maxLength: 500
        ville:
          type: string
          maxLength: 100

    UserUpdate:
      type: object
      additionalProperties: false
      required: [pseudo]
      properties:
        pseudo:
          type: string
          minLength: 1
          maxLength: 50
        bio:
          type: string
          maxLength: 500
        ville:
          type: string
          maxLength: 100

    Skill:
      type: object
      required: [nom, niveau]
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 50
        niveau:
          type: string
          enum: [débutant, intermédiaire, expert]

    SkillsReplace:
      type: object
      additionalProperties: false
      required: [skills]
      properties:
        skills:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Skill'

    ServiceCategory:
      type: string
      enum:
        - Informatique
        - Jardinage
        - Bricolage
        - Cuisine
        - Musique
        - Langues
        - Sport
        - Tutorat
        - Déménagement
        - Photographie
        - Animalier
        - Couture
        - Autre

    Service:
      type: object
      required:
        - id
        - provider_id
        - titre
        - categorie
        - duree_minutes
        - credits
        - actif
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        provider_id:
          type: integer
          minimum: 1
        titre:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        categorie:
          $ref: '#/components/schemas/ServiceCategory'
        duree_minutes:
          type: integer
          minimum: 1
        credits:
          type: integer
          minimum: 1
        ville:
          type: string
          maxLength: 100
        actif:
          type: boolean
        created_at:
          type: string
          format: date-time

    ServiceCreate:
      type: object
      additionalProperties: false
      required: [titre, categorie, duree_minutes, credits]
      properties:
        titre:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        categorie:
          $ref: '#/components/schemas/ServiceCategory'
        duree_minutes:
          type: integer
          minimum: 1
        credits:
          type: integer
          minimum: 1
        ville:
          type: string
          maxLength: 100

    ServiceUpdate:
      type: object
      additionalProperties: false
      required: [titre, categorie, duree_minutes, credits]
      properties:
        titre:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        categorie:
          $ref: '#/components/schemas/ServiceCategory'
        duree_minutes:
          type: integer
          minimum: 1
        credits:
          type: integer
          minimum: 1
        ville:
          type: string
          maxLength: 100
        actif:
          type: boolean

    ExchangeStatus:
      type: string
      enum: [pending, accepted, rejected, cancelled, completed]

    Exchange:
      type: object
      required:
        - id
        - service_id
        - requester_id
        - owner_id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        service_id:
          type: integer
          minimum: 1
        requester_id:
          type: integer
          minimum: 1
        owner_id:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ExchangeStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExchangeCreate:
      type: object
      additionalProperties: false
      required: [service_id]
      properties:
        service_id:
          type: integer
          minimum: 1

    Review:
      type: object
      required: [id, exchange_id, author_id, target_id, note, created_at]
      properties:
        id:
          type: integer
          minimum: 1
        exchange_id:
          type: integer
          minimum: 1
        author_id:
          type: integer
          minimum: 1
        target_id:
          type: integer
          minimum: 1
        note:
          type: integer
          minimum: 1
          maximum: 5
        commentaire:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time

    ReviewCreate:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: integer
          minimum: 1
          maximum: 5
        commentaire:
          type: string
          maxLength: 500

    UserStats:
      type: object
      required:
        - user_id
        - services_actifs
        - echanges_completes
        - credit_balance
        - note_moyenne
        - nb_avis
